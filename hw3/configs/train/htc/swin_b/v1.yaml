# HTC (Hybrid Task Cascade) + Swin-B (ImageNet-22K) | Training Config v1
# Total params: ~162M  ✓ (< 200M)

experiment:
  name: v1

model:
  name: htc
  backbone: swin_b
  num_classes: 4
  pretrain_weights:
    path: null

data:
  train_dir: data/train
  val_ratio: 0.2
  num_workers: 4
  use_oversampling: true

  augmentation:
    img_size: 800
    min_scale: 0.8
    max_scale: 1.5
    copy_paste:
      enabled: true
      prob: 0.5
      max_paste: 4
      rare_classes: [3]
      rare_boost: 3.0

training:
  gpu_ids: "5"                            # CUDA_VISIBLE_DEVICES (e.g. "0", "1", "0,1")
  device: cuda                            # relative to gpu_ids
  max_epochs: 36
  batch_size: 1
  lr: 0.00005
  weight_decay: 0.05
  warmup_epochs: 1
  lr_milestones: [24, 32]
  grad_clip: 1.0
  fp16: true

inference:
  score_thr: 0.05
  nms_iou_thr: 0.5

paths:
  base_dir: .
  checkpoint_dir: checkpoints/htc/swin_b/v1
  chart_dir: charts/htc/swin_b/v1
