experiment:
  name: v1

model:
  name: cascade_mask_rcnn
  backbone: resnext101                    # resnext101 | swin_b | swin_l | convnext_l
  num_classes: 4
  pretrain_weights:
    path: null                            

data:
  train_dir: data/train
  val_ratio: 0.2
  num_workers: 0
  use_oversampling: true                  # WeightedRandomSampler for rare classes

  augmentation:
    img_size: 1024
    min_scale: 0.5
    max_scale: 2.0
    copy_paste:
      enabled: true
      prob: 0.5
      max_paste: 4
      rare_classes: [3, 4]          
      rare_boost: 3.0

training:
  gpu_ids: "1,2,4"
  device: cuda
  max_epochs: 36
  batch_size: 2
  lr: 0.002
  weight_decay: 0.0001
  warmup_epochs: 1
  lr_milestones: [24, 32]
  grad_clip: 35.0
  fp16: false
  resume_from: null                        # set to checkpoint path to resume, e.g. checkpoints/.../last.pth

inference:
  score_thr: 0.05
  nms_iou_thr: 0.5

paths:
  base_dir: .                            
  checkpoint_dir: checkpoints/cascade_mask_rcnn/resnext101/v1
  chart_dir: charts/cascade_mask_rcnn/resnext101/v1
