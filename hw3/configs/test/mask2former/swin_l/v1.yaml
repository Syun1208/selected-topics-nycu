# Mask2Former + Swin-L | Test/Inference Config v1

experiment:
  name: v1

model:
  name: mask2former
  backbone: swin_l
  num_classes: 4

data:
  test_dir: data/test_release
  mapping_json: data/test_image_name_to_ids.json
  img_size: 800
  num_workers: 4

inference:
  device: cuda
  score_thr: 0.05
  nms_iou_thr: 0.5
  tta:
    enabled: false
    flip: true

paths:
  base_dir: .
  checkpoint_dir: checkpoints/mask2former/swin_l/v1
  checkpoint_path: checkpoints/mask2former/swin_l/v1/best.pth
  chart_dir: charts/mask2former/swin_l/v1
